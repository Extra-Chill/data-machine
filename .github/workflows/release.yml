name: Release

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

# Monorepo releases (homeboy-action#555): every merge releases each plugin
# with unreleased commits since its own `<id>-vX.Y.Z` tag, serially in one job,
# each with its own version bump, changelog, GitHub Release and zip. Plugins
# with nothing to release are skipped, and a plugin missed by one run is picked
# up by the next. Only data-machine claims GitHub's "Latest" release
# (`github.release_latest` in each homeboy.json), so
# releases/latest/download/data-machine.zip keeps pointing at core.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Preview the releases without making changes'
        type: boolean
        default: false
      component:
        description: 'Release only the plugin at this path (e.g. plugins/data-machine-events). Empty releases every changed plugin.'
        type: string
        default: ''
      bump:
        description: 'Explicit bump for that plugin: major, minor, patch or X.Y.Z. Needed when breaking commits are held back with major-requires-flag.'
        type: string
        default: ''

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    uses: Extra-Chill/homeboy-action/.github/workflows/release.yml@v2
    with:
      components: ${{ inputs.component == '' && 'all' || '' }}
      component: ${{ inputs.component }}
      args: ${{ inputs.component && inputs.bump && format('--bump {0} --force-lower-bump', inputs.bump) || '' }}
      dry-run: ${{ inputs.dry-run || false }}
    secrets: inherit
