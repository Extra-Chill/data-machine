name: Monorepo

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: monorepo-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  boundaries:
    name: Plugin boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Core references no extension; extensions reference no sibling
        run: tools/check-boundaries.sh
