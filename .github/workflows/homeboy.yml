name: Homeboy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: homeboy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  # This audit is repository policy, so run it directly instead of relying on Homeboy test discovery.
  prefix-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Audit WordPress identifier prefixes
        run: php tests/prefix-policy-audit.php

  homeboy-quality:
    if: ${{ github.event_name != 'push' }}
    uses: Extra-Chill/homeboy-action/.github/workflows/ci.yml@v2
    with:
      # Autofix on PRs is expressed by adding `refactor lint` to the commands
      # list — ci.yml@v2 has no `autofix`/`autofix-commands` inputs, and passing
      # undeclared inputs to a reusable workflow is a hard startup_failure.
      commands: ${{ github.event_name == 'pull_request' && 'review audit,review lint,refactor lint' || 'review audit,review lint' }}
      expected-commands: 'review audit,review lint'
    secrets: inherit

  homeboy-test:
    if: ${{ github.event_name != 'push' }}
    uses: Extra-Chill/homeboy-action/.github/workflows/ci.yml@v2
    with:
      # v2.14.2 keeps raw candidate evidence neutral; this reconciled Test gate
      # alone decides whether the full-suite candidate regresses from main.
      commands: 'review test'
      expected-commands: 'review test'
      scope: full
      differential-gating: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
      baseline-commands: ${{ github.event_name == 'pull_request' && 'review test' || 'none' }}
      execution-timeout-seconds: '3600'
      test-timeout-seconds: '3300'
      test-shards: '4'
    secrets: inherit
