<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Driftlane — Kanban Board</title>
  <meta name="description" content="Driftlane is a fast, keyboard-friendly kanban board with real pointer-driven drag-and-drop, WIP limits, checklists, filtering and local autosave. Vanilla HTML/CSS/JS.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='5' width='6' height='22' rx='2' fill='%236c8cff'/%3E%3Crect x='13' y='5' width='6' height='14' rx='2' fill='%232bbf9f'/%3E%3Crect x='22' y='5' width='6' height='18' rx='2' fill='%23b57bff'/%3E%3C/svg%3E">
</head>
<body data-theme="dark">
<div class="app">

  <!-- ══════════ SIDEBAR ══════════ -->
  <aside class="sidebar">
    <a class="brand" href="index.html">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="4" y="5" width="6" height="22" rx="2" fill="#6c8cff"/>
        <rect x="13" y="5" width="6" height="14" rx="2" fill="#2bbf9f"/>
        <rect x="22" y="5" width="6" height="18" rx="2" fill="#b57bff"/>
      </svg>
      <span>
        <span class="brand-name">Drift<b>lane</b></span><br>
        <span class="brand-sub">Boards</span>
      </span>
    </a>
    <nav class="side-nav" aria-label="Primary">
      <div class="side-section-label">Workspace</div>
      <a class="side-link" href="index.html">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="10" rx="1"/><rect x="17" y="4" width="4" height="13" rx="1"/></svg>
        Board
      </a>
      <a class="side-link" href="templates.html">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Templates
      </a>
      <div class="side-section-label">Reference</div>
      <a class="side-link" href="about.html">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><line x1="12" y1="11" x2="12" y2="16"/><circle cx="12" cy="8" r="0.6" fill="currentColor"/></svg>
        About Driftlane
      </a>
    </nav>
    <div class="side-foot">
      <span class="op-avatar">AO</span><span class="op">Amara Okafor</span><br>
      <span style="opacity:.75">Atlas Mobile · Eng Lead</span>
    </div>
  </aside>
  <div class="nav-scrim"></div>

  <!-- ══════════ TOPBAR ══════════ -->
  <header class="topbar">
    <button class="ctrl menu-toggle" id="menuToggle" aria-label="Toggle navigation">
      <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div class="page-title"><span id="boardName" title="Double-click to rename">Board</span> <small>drag cards · ? for shortcuts</small></div>
    <div class="topbar-spacer"></div>
    <button class="ctrl" id="exportBtn" aria-label="Export board as JSON">
      <svg viewBox="0 0 24 24"><path d="M12 3v12M8 11l4 4 4-4M5 21h14"/></svg>
      <span class="hide-sm">Export</span>
    </button>
    <button class="ctrl" id="importBtn" aria-label="Import board from JSON">
      <svg viewBox="0 0 24 24"><path d="M12 15V3M8 7l4-4 4 4M5 21h14"/></svg>
      <span class="hide-sm">Import</span>
    </button>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
    <button class="ctrl" id="resetBtn" aria-label="Reset to sample board">
      <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v4h4"/></svg>
      <span class="hide-sm">Reset</span>
    </button>
    <button class="ctrl" id="themeToggle" aria-label="Toggle color theme">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/></svg>
      <span data-theme-label>Dark</span>
    </button>
    <div class="clock" id="clock"></div>
  </header>

  <!-- ══════════ MAIN ══════════ -->
  <main class="main">

    <!-- toolbar: search + filters -->
    <div class="toolbar">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="search" id="searchInput" placeholder="Search cards…  (press /)" aria-label="Search cards">
      </div>
      <select class="filter-select" id="filterAssignee" aria-label="Filter by assignee"></select>
      <select class="filter-select" id="filterLabel" aria-label="Filter by label"></select>
      <select class="filter-select" id="filterPriority" aria-label="Filter by priority">
        <option value="">All priorities</option>
        <option value="urgent">Urgent</option>
        <option value="high">High</option>
        <option value="medium">Medium</option>
        <option value="low">Low</option>
      </select>
      <button class="ctrl tool-icon" id="mineToggle" aria-pressed="false">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M5 21a7 7 0 0 1 14 0"/></svg>
        My cards
      </button>
      <div class="tool-spacer"></div>
    </div>

    <!-- the board itself -->
    <div class="board-scroll">
      <div class="board" id="board" role="list" aria-label="Kanban board"></div>
    </div>

    <!-- stats + activity rail -->
    <div class="statsbar">
      <div class="stat-block">
        <div class="donut" id="statDone">
          <svg viewBox="0 0 58 58">
            <circle class="donut-bg" cx="29" cy="29" r="26" fill="none" stroke-width="6"/>
            <circle class="donut-ring" cx="29" cy="29" r="26" fill="none" stroke-width="6"/>
          </svg>
          <span class="donut-num">0%</span>
        </div>
        <div class="stat-meta">complete<b id="statTotal">0</b>cards total</div>
      </div>
      <div class="stat-bars" id="statBars"></div>
      <div class="activity">
        <h4>Recent activity</h4>
        <ul class="activity-list" id="activityList"></ul>
      </div>
    </div>

  </main>
</div>

<script src="js/data.js"></script>
<script src="js/render.js"></script>
<script src="js/dnd.js"></script>
<script src="js/modal.js"></script>
<script src="js/board.js"></script>
<script src="js/shell.js"></script>
</body>
</html>
