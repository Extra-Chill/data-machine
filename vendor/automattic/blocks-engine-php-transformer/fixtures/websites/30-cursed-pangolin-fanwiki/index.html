           SECTION 1: WHAT IS THE ORDER?

      <SECTION id="what-is" itemscope itemtype="https://schema.org/Organization" itemid="#velvet-pangolin">
        <H2 itemprop="name">&sect; I. What Is The Order?</H2>

        <!-- the !important war battlefield (caption rule, from style.css) -->
        <p class="sigil-caption" style="font-style:italic">A note on color of the sigil caption: contested since 2017.</p>

        <div class="about-section">
        <FONT face="Times New Roman" size="4" color="#3A1B47">
        The <B>Honorable and Imaginary Order of the Velvet Pangolin</B> &mdash;
        hereafter abbreviated as <acronym title="Honorable and Imaginary Order of the Velvet Pangolin">H.I.O.V.P.</acronym>
        or, colloquially, <ABBR title="The Order">The&nbsp;Order</ABBR> &mdash;
        was founded on the evening of <time datetime="1894-06-14" itemprop="foundingDate">14 June 1894</time>
        in the <I>snug</I> of <em>The Hanged Drayman</em>, a public house on Corn Street, Bristol,
        by three civil servants and one embalmer over the course of an evening that
        is recorded in the original minutes as &laquo;<U>protracted</U>&raquo;.
        </FONT>
        </div>

        <p>The Order's stated purpose, ratified that same evening and unchanged for one hundred and thirty-two years,
          is the <strong>contemplation, veneration, and cataloguing</strong> of the pangolin in all of its eight
          recognised and three rumoured species, together with the maintenance of <em>The&nbsp;Vault</em>
          &mdash; a collection of pangolin-adjacent ephemera kept at an undisclosed address in Bristol
          and known only to the <order-rank tier="vault-warden">Vault-Warden</order-rank> of the day.</p>

        <p lang="la">Motto officialis: <em>Per&nbsp;scalas&nbsp;ad&nbsp;astra</em>
          (by scales, to the stars). Adopted 1894. Translated by founder <ITEMPROP itemprop="founder">Reginald T. Pemberton</ITEMPROP>
          from a (now-discredited) Sufi aphorism that he had encountered in Cardiff.</p>

        <p lang="ar" dir="rtl">المثل الأصلي للنظام مأخوذ من قول صوفي: &laquo;الحرشفة تحفظ الجوهر&raquo;.</p>

        <p>The Order is described in its own foundational documents as &laquo;<i>semi-secret</i>&raquo;,
          a designation which has caused considerable confusion. The current <order-rank tier="vault-warden">Vault-Warden</order-rank>
          has clarified that this means: the existence of the Order is public, but its
          membership, holdings, meeting locations, oath, sigil derivation, scale-polishing
          schedule, financial accounts, and the identity of <span class="do-not-touch">[The Fourth]</span> are not.</p>

        <p>
          <font face="Cinzel,serif" color="#B22222" size="4">In&nbsp;spec&shy;ta&shy;bil&shy;i&shy;tas</font>
          (a fake Latin word coined by founder Pemberton, meaning approximately
          "the quality of not being looked at") is the central virtue of the Order.
          The word is conventionally written with soft hyphens between syllables;
          attentive readers will note its proper splitting as
          <span>in<wbr>spec<wbr>ta<wbr>bil<wbr>i<wbr>tas</span>.
        </p>

        <p><big>Encoded greeting to all visitors:</big>
          <font color="#3A1B47">&#65;&#108;&#108; &#104;&#97;&#105;&#108; &#116;&#104;&#101; &#80;&#97;&#110;&#103;&#111;&#108;&#105;&#110;.</font>
        </p>

          <em>Editor's note (Geoffrey, 2009):</em> this section has been re-written eighteen times.
          The current text is the seventeenth-and-a-half revision; the half is owed to Mavis,

      <Section id="founders" class="mystical" itemscope itemtype="https://schema.org/Organization">
        <H2>&sect; II. The Four Founders, June 1894</H2>

        <meta name="section-author" content="Reginald Quill, Esq.">
        <p>The four founders, gathered at <em>The Hanged Drayman</em> on the eve of the Summer
          Solstice 1894, are recorded thus. Portraits are sepia placeholders &mdash;
          the originals were lost in the <S>fire</S> <ins>"event"</ins> of 1923.</p>

        <Dl id="founders-list">
          <Dt itemprop="founder" itemscope itemtype="https://schema.org/Person">
            <figure style="display:inline-block;margin:0 12px 0 0;vertical-align:top;">
              <div style="width:96px;height:120px;background:linear-gradient(135deg,#8B5A8E,#3A1B47);border:3px solid #C49934;"></div>
              <figcaption style="font-family:'Cinzel',serif;color:#C49934;font-size:10px;text-align:center;max-width:96px;">
                <span itemprop="name">Reginald T. Pemberton, Esq.</span><br>
                <small lang="la"><i>Inspectabilitatem colo</i></small>
              </figcaption>
            </figure>
            <span itemprop="name">Reginald T. Pemberton, Esq.</span> &mdash;
            <span itemprop="jobTitle">Civil Servant (Cardiff)</span>
          </Dt>
          <DD>Author of the original motto. First to suggest the pangolin as totem.
            Reportedly arrived at the Drayman already in possession of a small box of copper-coloured scales,
            "for reasons he declined to elaborate upon." His <span lang="la"><em>inspectabilitatem colo</em></span>
            became the unofficial second motto of the Order.</DD>

          <dt itemprop="founder" itemscope itemtype="https://schema.org/Person">
            <figure style="display:inline-block;margin:0 12px 0 0;vertical-align:top;">
              <div style="width:96px;height:120px;background:linear-gradient(135deg,#C49934,#6a4818);border:3px solid #C49934;"></div>
              <figcaption style="font-family:'Cinzel',serif;color:#C49934;font-size:10px;text-align:center;max-width:96px;">
                <span itemprop="name">Cornelia P. Hawthorne</span><br>
                <small lang="grc"><i>&pi;&#7770;&sigma;&alpha; &phi;&omicron;&lambda;&#7984;&sigmaf;</i></small>
              </figcaption>
            </figure>
            <span itemprop="name">Cornelia P. Hawthorne</span> &mdash;
            <span itemprop="jobTitle">Civil Servant (Bristol)</span>
          </dt>
          <dd>First Vault-Warden (1894&ndash;1917). Authored the original Twelve Tenets in
            a single night, apparently while annoyed. Her Greek epigram
            <em lang="grc">πᾶσα φολίς</em> ("every scale") is inscribed on the inside lid of the Vault.</dd>

          <DT itemprop="founder" itemscope itemtype="https://schema.org/Person">
            <figure style="display:inline-block;margin:0 12px 0 0;vertical-align:top;">
              <div style="width:96px;height:120px;background:linear-gradient(135deg,#355E3B,#1a2f1c);border:3px solid #C49934;"></div>
              <figcaption style="font-family:'Cinzel',serif;color:#C49934;font-size:10px;text-align:center;max-width:96px;">

      <!-- ====================================================
           SECTION 3: THE TWELVE TENETS
           ==================================================== -->
      <section id="tenets">
        <h2>&sect; III. The Twelve Tenets</h2>
        <p>The Tenets were drafted by Cornelia Hawthorne on the night of 14 June 1894 in the parlour
          of <em>The Hanged Drayman</em>. They have been renumbered <strong>twice</strong> (1923, 1971)
          and the original numbering survives only in the Cardiff Archive. The current numbering follows.</p>

        <ol class="tenets-list">
          <li>
            <strong>Of the Scale.</strong> The scale is the unit of the world. Every scale, however small,
            participates in the Whole. To diminish a scale is to diminish the Whole.
            <details>
              <summary>Doctrinal commentary (1971 revision)</summary>
              <p>Hawthorne's original draft is terse. The 1971 commentary, attributed to Vault-Warden
                Wycliffe, expands: "By 'scale' we mean not the keratinous plate of the pangolin alone, but
                the measure of any thing &mdash; weight, importance, length of song. To weigh a thing falsely
                is therefore a heresy."</p>
            </details>
          </li>

          <li>
            <strong>Of the Coil.</strong> When threatened, the pangolin coils. So too the Order. We are at our
            most invulnerable when we present no aperture.
            <details>
              <summary>Doctrinal commentary</summary>
              <p>This tenet has been invoked at least twice (1947, 2003) to justify the Order's refusal to
                participate in external inquiries. The latter case is documented at <a href="talk-page.html#lost-1947">/talk-page.html#lost-1947</a>.</p>
            </details>
          </li>

          <li>
            <strong>Of the Nameless.</strong> Certain Scalebearers shall remain nameless in our records.
            The Fourth was the first. Others have followed and will follow. This is not a punishment;
            it is a privilege.
            <details>
              <summary>Doctrinal commentary</summary>
              <p>"The privilege of namelessness" is, by tradition, conferred upon any member who
                requests it formally, in writing, at a Convocation, and who can produce three Adept-Custodians
                willing to vouch for them. As of 2026 there are eleven nameless members.</p>
            </details>
          </li>

          <li>
            <strong>Of the Threshold.</strong> A door once crossed cannot be uncrossed. Mind the door.
            <details><summary>Commentary</summary><p>Originally a literal instruction about the back door
              of <em>The Hanged Drayman</em>, which sticks. Has since acquired metaphorical weight.</p></details>
          </li>

          <li>
            <strong>Of the Vault.</strong> What is in the Vault stays in the Vault. What leaves the Vault
            must return to the Vault.
            <details><summary>Commentary</summary><p>The single most-litigated Tenet in the Order's history.
              See Geoffrey-vs-Beatrix, 2014, and the subsequent "Sacred Sigil Glass Case Incident."</p></details>
          </li>

          <li>
            <strong>Of the Convocation.</strong> The Order shall meet annually. The Order shall make a quorum
            of three. The Order shall not meet in February.
            <details><summary>Commentary</summary><p>The February prohibition was added in 1923 after the
              foundational text was amended; no surviving member knows why.</p></details>
          </li>

          <li>
            <strong>Of the Scale-Polishing.</strong> Each Scalebearer shall polish at least one scale each
            month, in silence, with cloth provided.
            <details><summary>Commentary</summary><p>The provided cloth is, by tradition, a square of velvet
              cut from the lining of the original Vault-curtain. No replacement curtain has been authorised.</p></details>
          </li>

          <li>
            <strong>Of the Quiet Hour.</strong> Between three and four o'clock in the afternoon, on the
            second Tuesday of each month, the Scalebearer shall observe silence.
            <details><summary>Commentary</summary><p>Compliance is on the honour system. Geoffrey has,
              by his own admission, never managed an unbroken Quiet Hour.</p></details>
          </li>

          <li>
            <strong>Of Discretion in Correspondence.</strong> Order business shall not be conducted by
            postcard. (1923 amendment: nor by telegram.) (1971 amendment: nor by facsimile.)
            (1998 amendment: nor by electronic mail unless encrypted with the cipher in Appendix C.)
            (2014 amendment: amendment to 1998 amendment rescinded; encryption optional.)
            <details><summary>Commentary</summary><p>The cipher in Appendix C is ROT-13. This was not
              widely understood until 2002.</p></details>
          </li>

          <li>
            <strong>Of Welcome.</strong> The novice is to be welcomed. The novice is to be tested.
            The novice is not to be rushed.
            <details><summary>Commentary</summary><p>Average time from initial petition to confirmation
              as Initiate, per Vault records: 4.3 years. Geoffrey's was 9.</p></details>
          </li>

          <li>
            <strong>Of the Sigil.</strong> The Sigil shall be rendered in copper and velvet, and shall
            contain twelve scales in a ring. No other rendering is authoritative.
            <details>
              <summary>Doctrinal commentary &mdash; the Sacred Doctrine, deepest reveal</summary>
              <table border="1" cellpadding="6" cellspacing="0" style="background:#fff8e0;border:2px ridge #C49934;width:100%;">
                <tr><td>
                  <figure style="margin:0;">
                    <figcaption><b>The Sacred Pangolin Doctrine</b> (as recorded in the 1923 revision)</figcaption>
                    <dl>
                      <dt>Layer the First: Of Appearance</dt>
                      <dd>"The sigil shall appear as a pangolin coiled."
                        <details>
                          <summary>Layer the Second: Of Geometry</summary>
                          <p>"The coiling shall be that of a logarithmic spiral, with constant phi."</p>
                          <p>See also: <a href="#geometry">&sect; Sacred Geometry, below</a>.</p>
                        </details>
                      </dd>
                    </dl>
                  </figure>
                </td></tr>
              </table>
            </details>
          </li>

          <li>
            <strong>Of Returning.</strong> All Scalebearers, at end, return to the Vault.
            <details><summary>Commentary</summary><p>Interpreted variously since 1894. Currently
              taken to mean a symbolic return of one's polishing cloth to the Vault upon
              death or departure from the Order. Beatrix, formerly Vault-Warden, has assembled
              a notably large collection of cloths.</p></details>
          </li>
        </ol>
      </section>

      <!-- ====================================================
           SECTION 4: HIERARCHY (NESTED DL OF DOOM)
           ==================================================== -->
      <section id="ranks">
        <h4>&sect; IV. Hierarchy of Initiation Ranks</h4>
        <p>The Order recognises six ranks. Each rank contains sub-ranks. Each sub-rank contains
          conditions. Each condition contains an exception. Each exception contains a footnote. Each
          footnote contains, at minimum, one (1) reference to an unresolved Convocation vote.
          The full hierarchy follows. <em>Mind the depth.</em></p>

        <dl>
          <dt><order-rank tier="initiate">Initiate</order-rank></dt>
          <dd>
            One who has petitioned and been accepted, but not yet polished.
            <dl>
              <dt>Initiate, First Quarter</dt>
              <dd>0&ndash;3 months. Has not yet been issued a polishing cloth.
                <dl>
                  <dt>Initiate, First Quarter, Provisional</dt>
                  <dd>Awaiting background check by the Vault-Warden.
                    <dl>
                      <dt>Initiate, First Quarter, Provisional, Bristol-Resident</dt>
                      <dd>Subject to in-person interview at The Hanged Drayman.
                        <dl>
                          <dt>Initiate, First Quarter, Provisional, Bristol-Resident, Pub-Approved</dt>
                          <dd>Cleared by the landlord. May proceed to confirmation.
                            <dl>
                              <dt>Initiate, First Quarter, Provisional, Bristol-Resident, Pub-Approved, Conditionally-Cloth-Bearing</dt>
                              <dd>Issued a probationary cloth (cotton, not velvet) pending full confirmation.
                                <dl>
                                  <dt>&hellip;, Cloth-Bearing, Awaiting-Convocation</dt>
                                  <dd>Final step before Scalebearer status. Median wait: 18 months.</dd>
                                </dl>
                              </dd>
                            </dl>
                          </dd>
                        </dl>
                      </dd>
                    </dl>
                  </dd>
                </dl>
              </dt>
            </dl>
          </dd>

          <dt><order-rank tier="scalebearer">Scalebearer</order-rank></dt>
          <dd>
            A confirmed member. Has performed the Initiation Oath and received the velvet cloth.
            <dl>
              <dt>Scalebearer, Active</dt>
              <dd>Polishes monthly. Attends Convocations.
                <dl>
                  <dt>Scalebearer, Active, Decade-Holder</dt>
                  <dd>Ten or more consecutive years of compliance.</dd>
                </dl>
              </dd>
              <dt>Scalebearer, Lapsed</dt>
              <dd>Has missed two or more polishings. May be reinstated by Convocation vote.</dd>
              <dt>Scalebearer, Quiet</dt>
              <dd>Has invoked Tenet VIII as continuous standing. Communicates with the Order
                only via written correspondence.</dd>
            </dl>
          </dd>

          <dt><order-rank tier="adept">Adept</order-rank></dt>
          <dd>
            A Scalebearer of demonstrable depth. Eligible to vote on Tenet interpretation.
            <dl>
              <dt>Adept, Lay</dt>
              <dd>The default. Reads, polishes, attends.</dd>
              <dt>Adept-in-Training</dt>
              <dd>Apprenticed to an Adept-Custodian. Receives weekly correspondence in cipher.</dd>
            </dl>
          </dd>

          <dt><order-rank tier="custodian">Adept-Custodian</order-rank></dt>
          <dd>
            Custodian of a specific holding (a relic, a book, a ledger, a postal box).
            Membership is by appointment of the Vault-Warden.
            <dl>
              <dt>Adept-Custodian of the Lesser Holdings</dt>
              <dd>Pamphlets, correspondence, the smaller cloths.</dd>
              <dt>Adept-Custodian of the Greater Holdings</dt>
              <dd>The Doctrine itself, the founding minutes, the Original Box of Scales.
                <dl>
                  <dt>Custodian of the Original Box</dt>
                  <dd>A title held by one person at any time. Currently: Adept-Custodian Pemberton
                    (great-great-nephew of Reginald T. Pemberton, Esq., founder).
                    <dl>
                      <dt>Box-Polishing Conditions (1894)</dt>
                      <dd>The Box shall be polished only with the velvet cloth, only on the
                        anniversary of its acquisition, and only in the presence of at least
                        two witnesses, at least one of whom must be a Vault-Warden.</dd>
                    </dl>
                  </dd>
                </dl>
              </dd>
            </dl>
          </dd>

          <dt><order-rank tier="vault-warden">Vault-Warden</order-rank></dt>
          <dd>
            The single, supreme, ceremonial-and-administrative office of the Order. Held for life,
            or until honourable resignation, or until removal by unanimous Convocation vote
            (which has never occurred).
            <dl>
              <dt>Vault-Warden, Acting</dt>
              <dd>Appointed in the event of the Vault-Warden's temporary indisposition.</dd>
              <dt>Vault-Warden, Emeritus</dt>
              <dd>A Vault-Warden who has honourably resigned. Currently: Beatrix.</dd>
            </dl>
          </dd>

          <dt><order-rank tier="pangolin-equal">Pangolin-Equal</order-rank></dt>
          <dd>
            A title of singular honour, conferred by acclamation at a Convocation. As of 2026 there have
            been three legitimately bestowed Pangolin-Equals in the entire 132-year history of the Order,
            and approximately fourteen self-declared ones (see <a href="talk-page.html#rank-creep">/talk-page.html#rank-creep</a>).
          </dd>
        </dl>

        <p><font color="#B22222" size="2"><i>Footnote on rank-creep:</i> The Vault-Warden's office reminds
          members that <strong>self-promotion is not recognized</strong> regardless of how long ago it occurred
          or how convincingly the title appears on the petitioner's correspondence card.</font></p>
      </section>

      <!-- ====================================================
           SECTION 5: THE SACRED SIGIL + MathML GEOMETRY
           ==================================================== -->
      <section id="sigil" class="mystical">
        <h2>&sect; V. The Sacred Sigil</h2>
        <p>The Sigil, as authorized in Tenet XI, comprises twelve scales arranged in a ring about a
          coiled pangolin. The geometry of the coil is governed by the equations below. These were
          first derived by founder Hawthorne on the back of a draughtsman's blotter in 1894, and
          re-derived (with corrections) by Vault-Warden Wycliffe in 1971.</p>

        <a name="geometry"></a>
        <h6 id="geometry">&loz; Sacred Geometry of the Coil &loz;</h6>

        <div class="geometry-section">
          <p>The coil of the pangolin in the Sigil is a logarithmic spiral whose radius
            grows according to the golden ratio &phi;:</p>

          <math display="block" xmlns="http://www.w3.org/1998/Math/MathML">
            <mrow>
              <mi>r</mi><mo>(</mo><mi>&theta;</mi><mo>)</mo>
              <mo>=</mo>
              <msub><mi>r</mi><mn>0</mn></msub>
              <msup>
                <mi>&phi;</mi>
                <mfrac>
                  <mrow><mn>2</mn><mi>&theta;</mi></mrow>
                  <mi>&pi;</mi>
                </mfrac>
              </msup>
            </mrow>
          </math>

          <p>The total "scale curvature" &kappa;<sub>s</sub> of a single scale,
            integrated over its arc, is given by:</p>

          <math display="block" xmlns="http://www.w3.org/1998/Math/MathML">
            <mrow>
              <msub><mi>&kappa;</mi><mi>s</mi></msub>
              <mo>=</mo>
              <munderover>
                <mo>&int;</mo>
                <mn>0</mn>
                <mfrac><mi>&pi;</mi><mn>6</mn></mfrac>
              </munderover>
              <msqrt>
                <mrow>
                  <mn>1</mn>
                  <mo>+</mo>
                  <msup>
                    <mfenced>
                      <mfrac>
                        <mrow><mi>d</mi><mi>r</mi></mrow>
                        <mrow><mi>d</mi><mi>&theta;</mi></mrow>
                      </mfrac>
                    </mfenced>
                    <mn>2</mn>
                  </msup>
                </mrow>
              </msqrt>
              <mspace width="0.2em"/>
              <mi>d</mi><mi>&theta;</mi>
            </mrow>
          </math>

          <p>And the Sigil-wide constant, the &laquo;Pangolin Number&raquo; &Pi;<sub>p</sub>,
            is the matrix product of the twelve individual scale curvatures arranged radially:</p>

          <math display="block" xmlns="http://www.w3.org/1998/Math/MathML">
            <mrow>
              <msub><mi>&Pi;</mi><mi>p</mi></msub>
              <mo>=</mo>
              <mfenced open="|" close="|">
                <mtable>
                  <mtr>
                    <mtd><msub><mi>&kappa;</mi><mn>1</mn></msub></mtd>
                    <mtd><msub><mi>&kappa;</mi><mn>2</mn></msub></mtd>
                    <mtd><mo>&hellip;</mo></mtd>
                    <mtd><msub><mi>&kappa;</mi><mn>12</mn></msub></mtd>
                  </mtr>
                  <mtr>
                    <mtd><msup><mi>&phi;</mi><mn>1</mn></msup></mtd>
                    <mtd><msup><mi>&phi;</mi><mn>2</mn></msup></mtd>
                    <mtd><mo>&hellip;</mo></mtd>
                    <mtd><msup><mi>&phi;</mi><mn>12</mn></msup></mtd>
                  </mtr>
                </mtable>
              </mfenced>
            </mrow>
          </math>

          <p style="font-size:11px;color:#888;font-style:italic">
            (Wycliffe's 1971 derivation contains a notorious sign error in the &theta;-domain of
            the integral. The error has been preserved in all subsequent printings on the
            grounds that "correcting it would be presumptuous." See Convocation minutes, 1973.)
          </p>
        </div>

      </section>

      <!-- ====================================================
           SECTION 10: PRONOUNCEMENTS (nested blockquote chain)
           ==================================================== -->
      <section id="pronouncements">
        <H2>&sect; X. Pronouncements of the Order</H2>
        <p>The Order's official position on certain matters is established by a recursive chain of
          citations &mdash; each pronouncement cites its predecessor. The chain below is read from
          outermost (most recent) to innermost (1894).</p>

        <blockquote cite="https://velvetpangolin.example/pronouncements/2026">
          <p><b>2026 Pronouncement:</b> Upon the matter of the Velvet Pangolin's existence:
            &laquo;The Velvet Pangolin is real to those for whom realness is operative.&raquo;</p>
          <blockquote cite="https://velvetpangolin.example/pronouncements/2014">
            <p><b>2014:</b> Building upon the 1998 Pronouncement, which held:
              &laquo;Realness is operative for those who accept it as such.&raquo;</p>
            <blockquote cite="https://velvetpangolin.example/pronouncements/1998">
              <p><b>1998:</b> Reaffirming the 1971 Pronouncement, which held:
                &laquo;Acceptance is sufficient.&raquo;</p>
              <blockquote cite="https://velvetpangolin.example/pronouncements/1971">
                <p><b>1971:</b> Drawing upon the 1947 Pronouncement (the only known artifact of that Convocation), which held:
                  &laquo;Sufficiency is in the seeing.&raquo;</p>
                <blockquote cite="https://velvetpangolin.example/pronouncements/1923">
                  <p><b>1923:</b> Which itself extended the 1908 Pronouncement:
                    &laquo;Seeing is partial.&raquo;</p>
                  <blockquote cite="https://velvetpangolin.example/pronouncements/1908">
                    <p><b>1908:</b> Citing Hawthorne's 1897 dictum:
                      &laquo;Partial seeing is the natural state.&raquo;</p>
                    <blockquote cite="https://velvetpangolin.example/pronouncements/1897">
                      <p><b>1897:</b> Drawn from Pemberton's 1894 marginalia:
                        &laquo;The state is the scale.&raquo;</p>
                      <blockquote cite="https://velvetpangolin.example/pronouncements/1894">
                        <p><b>1894:</b> Hawthorne, in the original draft Tenets:
                          &laquo;Per scalas ad astra.&raquo;</p>
                      </blockquote>
                    </blockquote>
                  </blockquote>
                </blockquote>
              </blockquote>
            </blockquote>
          </blockquote>
        </blockquote>

        <p style="font-size:11px;color:#666;font-style:italic">Some Scalebearers, including Geoffrey,
        have argued that this entire pronouncement-chain is circular. The Vault-Warden's office has
        responded that a circle is also a coil, and that coiling is doctrinally sound (cf. Tenet II).</p>
      </section>

      <section id="correspondence">
        <h6>&sect; XII.b Selected Historical Correspondence</h6>
        <p>The Order's correspondence files are voluminous. The following are excerpted for
          their representative quality. Original spellings, formatting, and typographical
          conventions have been preserved exactly. Errors are theirs, not ours.</p>

        <article style="border:1px solid #888;padding:12px;margin:8px 0;background:#fff8e0;font-family:'Lucida Handwriting',cursive;">
          <header style="font-family:Georgia,serif;border-bottom:1px dotted #888;padding-bottom:4px;margin-bottom:6px;font-style:italic;color:#666;">
            <small>Letter from Cornelia Hawthorne to Reginald Pemberton, 22 Sept 1894</small>
          </header>
          <p style="font-style:italic;color:#3A1B47;">Dear Pemberton, &mdash;</p>
          <p>The matter of the curtain (velvet, hunter-green, twelve yards) is settled.
          Mr. Penrose has arranged for its conveyance from the Bristol drapers&rsquo; on
          Thursday next. I find your suggestion that the cloth be cut in advance of the
          Convocation <s>premature</s> <ins>injudicious</ins>; let us await the assembled
          membership before the first cut, as is fitting. The Fourth has communicated his assent
          by means of <strike>a written note</strike> <ins>a wordless gesture in the snug</ins>;
          I should not like to misrepresent him. &mdash; <i>C.P.H.</i></p>
        </article>

        <article style="border:1px solid #888;padding:12px;margin:8px 0;background:#fff8e0;font-family:'Courier New',monospace;font-size:13px;">

<pre style="white-space:pre-wrap;margin:0;font-family:inherit;color:inherit;background:none;border:none;padding:0;">From: geoffrey.w@velvetpangolin.example

      <!-- ====================================================
           SECTION 12c: A LITTLE BESTIARY (web-2.0 cards)
           ==================================================== -->
      <section id="bestiary">
        <h2>&sect; XII.c The Bestiary of Recognized Pangolins</h2>
        <p>The Order officially recognises eight extant species and three "rumoured" species of pangolin.
          They are catalogued here in glossy <em>web-2.0 cards</em> by Mavis (2007), which she did not
          finish styling, and which Geoffrey will not allow to be removed.</p>

        <div class="web2-card">
          <h3 style="margin-top:0">Manis crassicaudata &mdash; Indian pangolin</h3>
          <p>Found across the Indian subcontinent. Known for its especially broad scales,
          which Hawthorne (1894) identified as the &laquo;archetypal&raquo; pangolin form.
          The Order's Original Box of Scales is believed to be of this species.</p>
          <a class="web2-button" href="#">Read more &raquo;</a>
        </div>

        <div class="web2-card">
          <h3 style="margin-top:0">Smutsia gigantea &mdash; Giant ground pangolin</h3>
          <p>The largest pangolin. Documented by founder Penrose in a 1903 monograph as
          &laquo;the species most deserving of veneration on size alone&raquo;. The monograph
          has been quietly disputed by every Vault-Warden since.</p>
          <a class="web2-button" href="#">Read more &raquo;</a>
        </div>

        <div class="web2-card">
          <h3 style="margin-top:0">Phataginus tricuspis &mdash; White-bellied pangolin</h3>
          <p>The pangolin most often photographed and least often understood. The Order
          maintains a polite but distant relationship with this species.</p>
          <a class="web2-button" href="#">Read more &raquo;</a>
        </div>

        <div class="gloss-strip" aria-hidden="true"></div>

        <h4>The Three Rumoured Species</h4>

        <div class="modern-card">
          <h3>Manis velutina &mdash; The Velvet Pangolin</h3>
          <div>
            <p>The Order's namesake. Described in a single 1893 traveller's account (Pemberton, unpublished)
            as &laquo;coppered, velveted of skin, of a size between hare and badger, seen at twilight
            near the harbour&raquo;. No subsequent confirmation.</p>
          </div>
          <div>
            <p>Habitat: <em>"the harbour at twilight"</em> (sic).<br>
            Status: <strong>cryptid &mdash; revered</strong>.<br>
            Vault holdings: one (1) alleged scale, kept in a sealed glass capsule.
            <br>
            <a class="web2-button" href="#">View Scale</a>
            </p>
          </div>
        </div>

        <div class="modern-card">
          <h3>Manis chthonia &mdash; The Subterranean Pangolin</h3>
          <div><p>Reported only in the Cardiff Schism documents (1922&ndash;1924). The Vault-Warden's office
            does not recognise the Cardiff Schism as a doctrinal authority and therefore does not
            recognise <em>M. chthonia</em>; the entry is retained here for completeness.</p></div>
          <div><p>Status: <strong>repudiated</strong>.<br>
          The Cardiff documents themselves are held under glass at the Greater Holdings, with a
          warning label affixed by Vault-Warden Beatrix in 1991.</p></div>
        </div>

        <div class="modern-card">
          <h3>Manis nemorosus &mdash; The Wood-Wandering Pangolin</h3>
          <div><p>Mentioned in passing in a 1947 letter (sender unknown) that mysteriously survived
            the broader 1947 archival loss. The letter has been transcribed below in <code>&lt;pre&gt;</code>;
            its origin remains, like the Convocation of 1947 itself, unresolved.</p></div>
          <div>
<pre style="background:#fff;color:#3A1B47;border:1px dashed #888;padding:8px;font-family:'Courier New',monospace;font-size:11px;white-space:pre-wrap;">
  &laquo;...and on the third night I saw it, between the elm and the oak,
  a small armoured shape, neither rolling nor fleeing. It looked at me
  with the patience of a thing that has been looked at before. I did
  not approach. I do not know who you are, Vault-Warden, but you
  should know it was there. &mdash; [signature trimmed]&raquo;
</pre>
          </div>
        </div>
      </section>
